axelera-model-format: 1.0.0
name: yolo26n-raw-output-minmax-head-qat-epoch
description: YOLO26n plain raw-output ONNX after head-only fake-QAT; host-only screen candidate.
pipeline:
  - detections:
      model_name: yolo26n-raw-output-minmax-head-qat-epoch
      input: {type: image}
      preprocess:
        - letterbox: {height: "${{input_height}}", width: "${{input_width}}", scaleup: true}
        - torch-totensor:
      inference: {handle_all: false}
      postprocess:
        - decodeyolo: {box_format: xywh, conf_threshold: 0.25, label_filter: "${{label_filter}}", max_nms_boxes: 30000, nms_class_agnostic: false, nms_iou_threshold: 0.7, nms_top_k: 300, normalized_coord: false, use_multi_label: false, eval: {conf_threshold: 0.001, nms_class_agnostic: false, nms_iou_threshold: 0.7, use_multi_label: true}}
models:
  yolo26n-raw-output-minmax-head-qat-epoch:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: /home/ubuntu/voyager-sdk/experiments/cv-engine-94527ce/yolo26n-head-qat-epoch-260811.onnx
    task_category: ObjectDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 640, 640]
    input_color_format: RGB
    num_classes: 80
    dataset: CocoDataset-COCO2017
    extra_kwargs: {compiler_config_file: /home/ubuntu/voyager-sdk/experiments/cv-engine-94527ce/raw-output-minmax-head-qat-epoch.toml}
datasets:
  CocoDataset-COCO2017: {class: ObjDataAdapter, class_path: $AXELERA_FRAMEWORK/ax_datasets/objdataadapter.py, data_dir_name: coco, labels_path: $AXELERA_FRAMEWORK/ax_datasets/labels/coco.names, label_type: COCO2017}
operators:
  decodeyolo: {class: DecodeYolo, class_path: $AXELERA_FRAMEWORK/ax_models/decoders/yolo.py}
