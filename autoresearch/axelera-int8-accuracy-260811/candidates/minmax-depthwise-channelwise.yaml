axelera-model-format: 1.0.0

name: yolo26n-coco-onnx-minmax-depthwise-channelwise

description: >-
  YOLO26n SDK opset-17 ONNX with min-max PTQ and channel-wise depthwise
  convolution weights; CPU-screening candidate only until run on AIPU.

pipeline:
  - detections:
      model_name: yolo26n-coco-onnx-minmax-depthwise-channelwise
      input:
        type: image
      preprocess:
        - letterbox:
            height: ${{input_height}}
            scaleup: true
            width: ${{input_width}}
        - torch-totensor:
      inference:
        handle_all: false
      postprocess:
        - decodeyolo10:
            box_format: xyxy
            conf_threshold: 0.4
            dfl_size: 1
            label_filter: ${{label_filter}}
            normalized_coord: false
            top_k: 300
            use_multi_label: false
            eval:
              conf_threshold: 0.001
              use_multi_label: true

models:
  yolo26n-coco-onnx-minmax-depthwise-channelwise:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: /home/ubuntu/.cache/axelera/weights/yolo26n-coco-onnx/yolo26n.onnx
    task_category: ObjectDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 640, 640]
    input_color_format: RGB
    num_classes: 80
    dataset: CocoDataset-COCO2017
    extra_kwargs:
      compiler_config_file: /home/ubuntu/voyager-sdk/experiments/cv-engine-94527ce/minmax-depthwise-channelwise.toml

datasets:
  CocoDataset-COCO2017:
    class: ObjDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/objdataadapter.py
    data_dir_name: coco
    labels_path: $AXELERA_FRAMEWORK/ax_datasets/labels/coco.names
    label_type: COCO2017

operators:
  decodeyolo10:
    class: DecodeYolo10
    class_path: $AXELERA_FRAMEWORK/ax_models/decoders/yolo10.py
