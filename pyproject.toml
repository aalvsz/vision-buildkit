[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vision-buildkit"
version = "0.1.0"
description = "Research-only build, semantic validation, and packaging toolkit for portable object-detection artifacts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "LicenseRef-Vision-BuildKit-Research-1.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Ander Alvarez Sanz" },
]
keywords = [
    "computer-vision",
    "object-detection",
    "model-portability",
    "model-validation",
    "model-packaging",
    "onnx",
    "openvino",
    "tensorrt",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26", "pillow>=10", "pydantic>=2.7", "PyYAML>=6", "typer>=0.12", "fastapi>=0.111", "python-multipart>=0.0.9", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/aalvsz/vision-buildkit"
Repository = "https://github.com/aalvsz/vision-buildkit"
Issues = "https://github.com/aalvsz/vision-buildkit/issues"

[project.optional-dependencies]
pytorch = ["torch>=2.2"]
onnx = ["onnxruntime>=1.17", "onnx>=1.15", "onnxconverter-common>=1.14", "onnxslim>=0.1.82", "opencv-python-headless>=4.9"]
adapters = ["onnxruntime>=1.17", "onnx>=1.15", "onnxslim>=0.1.82", "opencv-python-headless>=4.9", "torch>=2.2", "torchvision>=0.17"]
openvino = ["openvino>=2024.0", "nncf>=2.19", "onnxruntime>=1.17", "onnx>=1.15", "onnxconverter-common>=1.14", "onnxslim>=0.1.82", "opencv-python-headless>=4.9"]
yolo = ["ultralytics>=8.3"]
libreyolo = ["libreyolo>=1.4"]
rfdetr = ["rfdetr"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
quantization = ["onnxruntime>=1.17", "onnx>=1.15", "onnxconverter-common>=1.14"]
metrics = ["pycocotools>=2.0.7"]
validation = ["pycocotools>=2.0.7", "scipy>=1.11"]
video = ["opencv-python-headless>=4.9"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
vision = "vision.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["vision"]

[tool.hatch.build.targets.sdist]
include = [
    "/vision",
    "/tests",
    "/scripts",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
