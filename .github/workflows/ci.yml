name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Repository integrity
        run: uv run python scripts/verify_repository.py

      - name: Release manifest integrity
        run: |
          uv run python scripts/release_manifest.py create /tmp/vision-buildkit-release-manifest.json
          uv run python scripts/release_manifest.py verify /tmp/vision-buildkit-release-manifest.json

      - name: Dependency inventory
        run: uv run python scripts/dependency_inventory.py --output /tmp/vision-buildkit-dependencies.json

      - name: Check formatting
        run: uv run ruff format --check vision tests scripts

      - name: Test
        run: uv run coverage run -m pytest -q

      - name: Coverage
        run: uv run coverage report --fail-under=70

      - name: Build
        run: uv build
